<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نور - القرآن الكريم</title>
<style>
body{font-family:sans-serif;background:#f5f5f0;margin:0;padding:15px;transition:.3s}
body.dark{background:#111;color:#fff}
header{display:flex;justify-content:space-between;align-items:center}
button{padding:10px 14px;border:none;border-radius:10px;background:#0d7a5f;color:#fff;cursor:pointer}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #ccc;margin:12px 0;font-size:16px}
.surah{background:#fff;padding:14px;border-radius:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.dark .surah{background:#222}
.fav{font-size:22px;cursor:pointer}
#tasbeeh{text-align:center;background:#0d7a5f;color:#fff;padding:20px;border-radius:15px;margin-top:20px}
#count{font-size:50px}
audio{width:100%;margin-top:10px}
</style>
</head>
<body>
<header>
<h2>🕌 نور - القرآن الكريم</h2>
<button onclick="document.body.classList.toggle('dark')">🌙 ليلي</button>
</header>

<input id="search" placeholder="🔍 ابحث عن سورة... الفاتحة، يس..." oninput="render()">

<div id="list"></div>

<div id="tasbeeh">
<h3>📿 السبحة الإلكترونية</h3>
<div id="count">0</div>
<p id="zekr">سبحان الله</p>
<button onclick="tasbeeh()" style="background:#fff;color:#0d7a5f;font-size:20px;padding:15px 40px">اضغط للتسبيح</button><br><br>
<button onclick="changeZekr()">تغيير الذكر</button>
<button onclick="resetT()">تصفير</button>
</div>

<script>
let surahs=[
["الفاتحة",7,"مكية"],["البقرة",286,"مدنية"],["آل عمران",200,"مدنية"],["النساء",176,"مدنية"],["المائدة",120,"مدنية"],["الأنعام",165,"مكية"],["الأعراف",206,"مكية"],["الأنفال",75,"مدنية"],["التوبة",129,"مدنية"],["يونس",109,"مكية"],["هود",123,"مكية"],["يوسف",111,"مكية"],["الرعد",43,"مدنية"],["إبراهيم",52,"مكية"],["الحجر",99,"مكية"],["النحل",128,"مكية"],["الإسراء",111,"مكية"],["الكهف",110,"مكية"],["مريم",98,"مكية"],["طه",135,"مكية"],["الأنبياء",112,"مكية"],["الحج",78,"مدنية"],["المؤمنون",118,"مكية"],["النور",64,"مدنية"],["الفرقان",77,"مكية"],["الشعراء",227,"مكية"],["النمل",93,"مكية"],["القصص",88,"مكية"],["العنكبوت",69,"مكية"],["الروم",60,"مكية"],["لقمان",34,"مكية"],["السجدة",30,"مكية"],["الأحزاب",73,"مدنية"],["سبأ",54,"مكية"],["فاطر",45,"مكية"],["يس",83,"مكية"],["الصافات",182,"مكية"],["ص",88,"مكية"],["الزمر",75,"مكية"],["غافر",85,"مكية"],["فصلت",54,"مكية"],["الشورى",53,"مكية"],["الزخرف",89,"مكية"],["الدخان",59,"مكية"],["الجاثية",37,"مكية"],["الأحقاف",35,"مكية"],["محمد",38,"مدنية"],["الفتح",29,"مدنية"],["الحجرات",18,"مدنية"],["ق",45,"مكية"],["الذاريات",60,"مكية"],["الطور",49,"مكية"],["النجم",62,"مكية"],["القمر",55,"مكية"],["الرحمن",78,"مدنية"],["الواقعة",96,"مكية"],["الحديد",29,"مدنية"],["المجادلة",22,"مدنية"],["الحشر",24,"مدنية"],["الممتحنة",13,"مدنية"],["الصف",14,"مدنية"],["الجمعة",11,"مدنية"],["المنافقون",11,"مدنية"],["التغابن",18,"مدنية"],["الطلاق",12,"مدنية"],["التحريم",12,"مدنية"],["الملك",30,"مكية"],["القلم",52,"مكية"],["الحاقة",52,"مكية"],["المعارج",44,"مكية"],["نوح",28,"مكية"],["الجن",28,"مكية"],["المزمل",20,"مكية"],["المدثر",56,"مكية"],["القيامة",40,"مكية"],["الإنسان",31,"مدنية"],["المرسلات",50,"مكية"],["النبأ",40,"مكية"],["النازعات",46,"مكية"],["عبس",42,"مكية"],["التكوير",29,"مكية"],["الانفطار",19,"مكية"],["المطففين",36,"مكية"],["الانشقاق",25,"مكية"],["البروج",22,"مكية"],["الطارق",17,"مكية"],["الأعلى",19,"مكية"],["الغاشية",26,"مكية"],["الفجر",30,"مكية"],["البلد",20,"مكية"],["الشمس",15,"مكية"],["الليل",21,"مكية"],["الضحى",11,"مكية"],["الشرح",8,"مكية"],["التين",8,"مكية"],["العلق",19,"مكية"],["القدر",5,"مكية"],["البينة",8,"مدنية"],["الزلزلة",8,"مدنية"],["العاديات",11,"مكية"],["القارعة",11,"مكية"],["التكاثر",8,"مكية"],["العصر",3,"مكية"],["الهمزة",9,"مكية"],["الفيل",5,"مكية"],["قريش",4,"مكية"],["الماعون",7,"مكية"],["الكوثر",3,"مكية"],["الكافرون",6,"مكية"],["النصر",3,"مدنية"],["المسد",5,"مكية"],["الإخلاص",4,"مكية"],["الفلق",5,"مكية"],["الناس",6,"مكية"]
];
let favs=JSON.parse(localStorage.getItem('favs')||'[]');
function render(){
let q=document.getElementById('search').value;
let html='';
surahs.forEach((s,i)=>{
if(!s[0].includes(q)) return;
let isFav=favs.includes(i);
html+=`<div class="surah"><div><b>${i+1}. ${s[0]}</b><br><small>${s[1]} آية - ${s[2]}</small><br><audio controls src="https://cdn.islamic.network/quran/audio-surah/128/ar.alafasy/${i+1}.mp3"></audio></div><div class="fav" onclick="toggleFav(${i})">${isFav?'❤️':'🤍'}</div></div>`;
});
document.getElementById('list').innerHTML=html||'<p>لا توجد نتائج</p>';
}
function toggleFav(i){
if(favs.includes(i)) favs=favs.filter(x=>x!==i); else favs.push(i);
localStorage.setItem('favs',JSON.stringify(favs)); render();
}
let c=0, azkar=["سبحان الله","الحمد لله","الله أكبر","استغفر الله","لا إله إلا الله"], zi=0;
function tasbeeh(){c++; document.getElementById('count').innerText=c;}
function changeZekr(){zi=(zi+1)%azkar.length; document.getElementById('zekr').innerText=azkar[zi]; c=0; document.getElementById('count').innerText=0;}
function resetT(){c=0; document.getElementById('count').innerText=0;}
render();
</script>
</body>
</html>
